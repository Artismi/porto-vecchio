<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Porto Vecchio — Isola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: il gioco occupa tutta la pagina; HUD agli angoli, dialoghi in basso tra le bande cinematografiche.
   Look unico e deliberato: notte di porto, carta calda per il testo, lanterne ambra, neon rosa e ciano. */
:root {
  --ink: #0d0b1a;
  --panel: rgba(17, 13, 32, .88);
  --panel-solid: #15112a;
  --line: #3b3252;
  --fg: #f0e6d0;
  --muted: #a89fbd;
  --amber: #ffb35c;
  --neon: #ff4fa3;
  --cyan: #35e6ff;
  --blood: #ff5a5a;
  --good: #7ee0a0;
  --rumor: #8fb0ff;
  --f-pix: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --f-label: "Silkscreen", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; background: var(--ink); color: var(--fg); }
body { font-family: var(--f-pix); font-size: 15px; line-height: 1.35; overflow: hidden; }
#app { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ink); user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: auto; touch-action: none; outline: none; cursor: none; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.hud { position: absolute; font-family: var(--f-pix); }
.card { background: var(--panel); border: 2px solid var(--line); box-shadow: 0 0 0 2px #07060e, 4px 4px 0 #07060e; }
.lbl { font-family: var(--f-label); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
button { font-family: var(--f-pix); }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* Debito e orologio */
#debt { left: 14px; top: 14px; width: min(290px, calc(100vw - 150px)); padding: 10px 12px; display: grid; gap: 6px; }
#debt .money { font-size: 22px; font-weight: 700; color: var(--amber); font-variant-numeric: tabular-nums; }
#debt .money small { font-size: 13px; color: var(--muted); font-weight: 400; }
.bar { height: 8px; background: #241d38; border: 1px solid #07060e; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--amber), #ffd98a); }
#clock { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
#clock b { color: var(--fg); font-weight: 600; }
#left { color: var(--muted); }
#left.urgent { color: var(--blood); }
#job { font-size: 13.5px; color: var(--amber); display: flex; gap: 6px; align-items: baseline; }
#job::before { content: "◆"; font-size: 11px; }

/* Ricercato */
#wanted { right: 14px; top: 14px; padding: 6px 10px; display: flex; gap: 4px; align-items: center; }
#wanted .star { width: 14px; height: 14px; background: #3a3150; clip-path: polygon(50% 0, 62% 36%, 100% 38%, 70% 60%, 80% 100%, 50% 76%, 20% 100%, 30% 60%, 0 38%, 38% 36%); }
#wanted .star.on { background: var(--blood); }
#wanted.chase .star.on { animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { background: var(--cyan); } }
#bookBtn { right: 14px; top: 52px; pointer-events: auto; padding: 6px 10px; color: var(--fg); cursor: pointer; font-size: 14px; display: flex; gap: 8px; align-items: center; }
#bookBtn kbd { font-family: var(--f-label); font-size: 10px; color: var(--amber); }

/* Notizie e voci */
#feed { left: 14px; top: 150px; width: min(330px, calc(100vw - 28px)); display: grid; gap: 5px; }
.fi { padding: 5px 9px; font-size: 13.5px; background: rgba(13, 11, 26, .78); border-left: 3px solid var(--muted); animation: fin .3s steps(3); }
.fi.rumor { border-color: var(--rumor); } .fi.bad { border-color: var(--blood); } .fi.money, .fi.good { border-color: var(--good); } .fi.job { border-color: var(--amber); }
@keyframes fin { from { transform: translateX(-12px); opacity: 0; } }

/* Suggerimenti contestuali */
#ctx { left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 200px); }
.chip { padding: 5px 9px; font-size: 14px; display: flex; gap: 7px; align-items: center; background: var(--panel); border: 2px solid var(--line); box-shadow: 3px 3px 0 #07060e; }
.chip kbd { font-family: var(--f-label); font-size: 11px; background: var(--fg); color: var(--ink); padding: 1px 5px; }
.chip.bad kbd { background: var(--blood); }

/* Minimappa */
#mini { right: 18px; bottom: 18px; width: 150px; height: 150px; }
#mini canvas { width: 150px; height: 150px; image-rendering: pixelated; transform: rotate(45deg) scale(.72); border: 2px solid var(--line); box-shadow: 0 0 0 2px #07060e; background: #0a0816; }

/* Fumetti sopra le teste */
.bub { position: absolute; transform: translate(-50%, -100%); max-width: 210px; padding: 5px 8px; background: #f3ead6; color: #1a1422; font-size: 13.5px; line-height: 1.25; border: 2px solid #1a1422; box-shadow: 3px 3px 0 rgba(0,0,0,.5); text-align: center; }
.bub::after { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #1a1422; }
.bub.hot { background: #ffd2dc; }
.bub.rumor { background: #dde6ff; }
.bub .who { display: block; font-family: var(--f-label); font-size: 9px; color: #6a5a7a; margin-bottom: 1px; }
.tag { position: absolute; transform: translate(-50%, -100%); font-size: 12px; white-space: nowrap; color: var(--fg); text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000; text-align: center; }
.tag .att { font-family: var(--f-label); font-size: 9px; display: block; }
.att.good { color: var(--good); } .att.bad { color: var(--blood); } .att.warn { color: var(--amber); } .att.none { color: var(--muted); }
.ico { position: absolute; transform: translate(-50%, -100%); font-family: var(--f-label); font-size: 14px; font-weight: 700; text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000; }
.ico.seen { color: var(--amber); } .ico.heard { color: var(--rumor); } .ico.fear { color: var(--blood); } .ico.bribe { color: #ffe070; } .ico.friend { color: var(--good); }
.edge { position: absolute; width: 0; height: 0; border: 9px solid transparent; border-left-color: var(--amber); filter: drop-shadow(1px 1px 0 #000); }

/* Momento cinematografico */
#moment { left: 0; right: 0; top: 17%; text-align: center; font-size: clamp(22px, 3.4vw, 38px); font-weight: 700; color: var(--fg); text-shadow: 3px 3px 0 #000; letter-spacing: .02em; }
#moment small { display: block; font-size: 15px; font-weight: 400; color: var(--muted); margin-top: 4px; }

/* Dialogo */
#dialog { left: 50%; bottom: 13vh; transform: translateX(-50%); width: min(720px, calc(100vw - 24px)); padding: 14px; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; pointer-events: auto; }
#dialog .pt { width: 88px; height: 88px; image-rendering: pixelated; border: 2px solid var(--line); background: #231c38; }
#dialog h3 { margin: 0; font-size: 19px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
#dialog .role { color: var(--muted); font-size: 13px; }
#dialog .lines { margin: 8px 0 10px; display: grid; gap: 4px; font-size: 16px; min-height: 2.6em; }
#dialog .lines p { margin: 0; }
#dialog .lines p.res-good { color: var(--good); } #dialog .lines p.res-bad { color: #ff9b9b; }
.opts { display: grid; gap: 5px; }
.opt { text-align: left; background: #1d1733; border: 2px solid var(--line); color: var(--fg); padding: 6px 10px; font-size: 15px; cursor: pointer; display: flex; gap: 10px; }
.opt:hover, .opt:focus-visible { border-color: var(--amber); background: #2a2146; outline: none; }
.opt kbd { font-family: var(--f-label); font-size: 11px; color: var(--amber); min-width: 12px; }
@media (max-width: 560px) { #dialog { grid-template-columns: 56px minmax(0, 1fr); bottom: 10vh; } #dialog .pt { width: 56px; height: 56px; } }

/* Taccuino */
[hidden] { display: none !important; }
#ring { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 5; }
#ring button { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; font-family: var(--f-pix); font-size: 14px; line-height: 1; padding: 7px 11px; background: var(--panel); color: var(--fg); border: 2px solid var(--line); box-shadow: 0 0 0 2px #07060e, 3px 3px 0 #07060e; cursor: pointer; white-space: nowrap; }
#ring button.bad { border-color: #8a2a4a; }
#ring button:hover, #ring button:focus-visible { border-color: var(--amber); color: var(--amber); outline: none; }
#ring .who { position: absolute; transform: translate(-50%, -50%); font-family: var(--f-pix); font-size: 13px; color: var(--amber); white-space: nowrap; text-shadow: 0 2px 0 #07060e, 0 0 6px #07060e; }
#hover { position: absolute; pointer-events: none; font-family: var(--f-pix); font-size: 13px; color: var(--fg); background: var(--panel); border: 2px solid var(--line); padding: 3px 7px; white-space: nowrap; transform: translate(14px, 14px); z-index: 4; }
#book { inset: 5vh 4vw; pointer-events: auto; display: grid; grid-template-rows: auto auto minmax(0, 1fr); background: #efe3c8; color: #2a2030; border: 3px solid #1a1422; box-shadow: 8px 8px 0 rgba(0,0,0,.6); }
#book header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 4px; gap: 10px; }
#book h2 { margin: 0; font-size: 24px; font-weight: 700; }
#book .x { background: #2a2030; color: #efe3c8; border: 0; padding: 5px 10px; cursor: pointer; font-size: 14px; }
#book nav { display: flex; gap: 4px; padding: 0 16px; border-bottom: 2px solid #2a2030; flex-wrap: wrap; }
#book nav button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 7px 10px; font-size: 15px; cursor: pointer; color: #6a5a6e; }
#book nav button[aria-selected="true"] { color: #2a2030; border-bottom-color: #c43c52; font-weight: 600; }
#book .body { overflow-y: auto; padding: 14px 16px 20px; }
@media (max-width: 640px) { #book { inset: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0) 0; border-width: 0; box-shadow: none; } #book h2 { font-size: 21px; } #book .x { padding: 10px 14px; font-size: 15px; } #book nav button { font-size: 16px; padding: 10px 10px; } #book .body { font-size: 15.5px; } }   /* [menu2] taccuino a tutto schermo in verticale */
body:has(#mu.on) #pvDevBtn, body:has(#book:not([hidden])) #pvDevBtn { display: none !important; }   /* [menu2] il DEV non copre titoli e Chiudi */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.pc { border: 2px solid #2a2030; background: #f7eedb; padding: 10px; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; align-content: start; }
.pc canvas { width: 48px; height: 48px; image-rendering: pixelated; border: 2px solid #2a2030; }
.pc h4 { margin: 0; font-size: 16px; }
.pc .r { font-size: 12.5px; color: #6a5a6e; }
.pc .a { display: inline-block; font-family: var(--f-label); font-size: 9px; padding: 2px 5px; margin-top: 3px; background: #2a2030; color: #efe3c8; }
.pc .a.good { background: #2f7a55; } .pc .a.bad { background: #b23a4a; } .pc .a.warn { background: #b8792a; }
.pc ul { grid-column: 1 / -1; margin: 0; padding-left: 16px; font-size: 13.5px; display: grid; gap: 3px; }
.pc li.voce { color: #3a4a9a; } .pc li.visto { color: #8a2a2a; } .pc li.good { color: #2f6a45; }
.pc .now { grid-column: 1 / -1; font-size: 12.5px; color: #6a5a6e; border-top: 1px dashed #b8a88a; padding-top: 5px; }
.pc .now b { color: #2a2030; }
.pc .jobl { grid-column: 1 / -1; font-size: 12.5px; }
.evl { display: grid; gap: 8px; }
.ev { border: 2px solid #2a2030; background: #f7eedb; padding: 8px 10px; display: grid; gap: 5px; }
.ev .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ev .dots { display: flex; gap: 3px; flex-wrap: wrap; }
.ev .dots span { font-family: var(--f-label); font-size: 9px; padding: 1px 4px; background: #d6c9ad; color: #6a5a6e; }
.ev .dots span.visto { background: #c43c52; color: #fff; } .ev .dots span.voce { background: #4a5ab8; color: #fff; } .ev .dots span.sentito, .ev .dots span.scoperto { background: #8a7a6a; color: #fff; } .ev .dots span.denuncia, .ev .dots span.radio { background: #1b2544; color: #fff; } .ev .dots span.alt { background: #2f7a55; color: #fff; }
.logl p { margin: 0 0 4px; font-size: 14px; } .logl p.bad { color: #8a2a2a; } .logl p.good { color: #2f6a45; }
.hint { font-size: 13.5px; color: #6a5a6e; margin: 0 0 10px; max-width: 70ch; }

/* Schermate di apertura e fine */
.screen { inset: 0; pointer-events: auto; display: grid; place-items: center; padding: 20px 16px; overflow-y: auto; }
.screen .in { max-width: 640px; display: grid; gap: 14px; text-align: center; }
.logo { font-size: clamp(44px, 9vw, 96px); font-weight: 700; line-height: .9; color: #ffe8f2; text-shadow: 0 0 6px var(--neon), 0 0 18px var(--neon), 4px 4px 0 #2a0a1a; letter-spacing: .02em; }
.tagline { font-family: var(--f-label); color: var(--cyan); font-size: 12px; letter-spacing: .2em; text-shadow: 0 0 8px var(--cyan); }
.story { background: rgba(13,11,26,.8); border: 2px solid var(--line); padding: 14px 16px; text-align: left; font-size: 15.5px; display: grid; gap: 8px; }
.story p { margin: 0; }
.story b { color: var(--amber); font-weight: 600; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--muted); justify-content: center; }
.keys kbd { font-family: var(--f-label); font-size: 10px; background: var(--fg); color: var(--ink); padding: 1px 5px; margin-right: 4px; }
.cta { justify-self: center; background: var(--neon); color: #1a0a14; border: 0; font-size: 20px; font-weight: 700; padding: 10px 28px; cursor: pointer; box-shadow: 4px 4px 0 #07060e; }
.cta:hover { background: #ff7abb; }
.carico0 { position: fixed; left: 0; right: 0; bottom: max(34px, calc(env(safe-area-inset-bottom) + 26px)); justify-items: center; gap: 8px !important; max-width: none !important; } .carico0 .lbl { font-size: 11px; color: var(--fg); opacity: .85; } .carico0 .bar { width: min(240px, 60vw); } .carico0 .bar i { transition: width .4s; } .carico0 .credits { position: fixed; left: 0; right: 0; bottom: max(8px, env(safe-area-inset-bottom)); font-size: 10px; opacity: .55; padding: 0 12px; } .carico0 .credits a { color: inherit; }   /* [diretto] il caricamento, senza pulsanti */
.intro2 { gap: 28px; padding: 0 20px; } .intro2 .logo { font-size: clamp(40px, 11vw, 92px); line-height: 1; text-transform: uppercase; } .intro2 .cta { font-size: 22px; padding: 16px 36px; } .intro2 .credits { position: fixed; left: 0; right: 0; bottom: max(8px, env(safe-area-inset-bottom)); font-size: 10px; opacity: .55; padding: 0 12px; } .intro2 .credits a { color: inherit; }   /* [menu2] */
.endlist { display: grid; gap: 6px; text-align: left; max-height: 44vh; overflow-y: auto; }
.endlist .row { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center; background: rgba(13,11,26,.82); border: 2px solid var(--line); padding: 6px 8px; font-size: 14px; }
.endlist canvas { width: 36px; height: 36px; image-rendering: pixelated; }
.endlist .row b { font-weight: 600; }

/* Controlli touch */
#touch { inset: auto 0 0 0; height: 44%; pointer-events: none; }
#stick { position: absolute; left: 22px; bottom: 26px; width: 130px; height: 130px; border-radius: 50%; border: 2px solid rgba(240,230,208,.35); background: rgba(13,11,26,.35); pointer-events: auto; touch-action: none; }
#knob { position: absolute; left: 43px; top: 43px; width: 44px; height: 44px; border-radius: 50%; background: rgba(240,230,208,.6); }
/* [mobile] i pulsanti di adesso: il principale in basso a destra, sotto il pollice; gli altri sopra e a sinistra */
#tbtns { position: absolute; right: 14px; bottom: 16px; width: 224px; display: flex; flex-direction: row-reverse; flex-wrap: wrap-reverse; align-items: flex-end; gap: 8px; pointer-events: auto; }
#tbtns button { width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(240,230,208,.35); background: rgba(13,11,26,.62); color: var(--fg); font-family: var(--f-label); font-size: 11px; line-height: 1.1; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; display: grid; place-content: center; }
#tbtns button.big { width: 84px; height: 84px; font-size: 14px; border-color: rgba(255,210,58,.6); }
#tbtns button small { display: block; font-size: 8px; opacity: .7; margin-top: 2px; }
#tbtns button.on { background: rgba(255,210,58,.3); border-color: var(--amber); }
/* [console] dentro il Game Boy di Porto Vecchio lo schermo resta pulito (main.js, sezione [console]): i comandi stanno nella
   pulsantiera della console; soldi, ora, minimappa, taccuino, cantiere e suggerimenti nel menu (lo zaino). Sopra il mondo restano
   le scritte dei posti, le stelle solo quando ti cercano, un avviso alla volta in basso e, in casa, una riga sola col piano */
#app.console #touch, #app.console #dock, #app.console #bookBtn, #app.console #sound, #app.console #debt, #app.console #mini,
#app.console #ctx, #app.console #cnBtn, #app.console #rs-hud, #app.console #rs-here, #app.console #me-box, #app.console #weapon,
#app.console #rs-open, #app.console #rs-sneak, body.pv-console #pvDevBtn { display: none !important; }
#app.console #wanted:not(:has(.star.on)) { display: none !important; }
#app.console #feed { top: auto !important; bottom: 10px; left: 50% !important; transform: translateX(-50%); width: min(92%, 440px) !important; text-align: center; }
#app.console #feed .fi { font-size: 13px; padding: 5px 12px; border-left: 0; border-radius: 14px; background: rgba(13, 11, 26, .72); text-shadow: none; animation: fin2 .25s ease-out; }
#app.console #feed .fi:nth-child(n+2) { display: none; }   /* un avviso alla volta: il più recente */
@keyframes fin2 { from { transform: translateY(6px); opacity: 0; } }
#app.console #rs-indoor { top: 8px !important; max-width: 92%; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; padding: 3px 10px; border-radius: 12px; border: 0; opacity: .9; }
@media (pointer: coarse) { #mini { top: 96px; bottom: auto; right: 4px; transform: scale(.72); transform-origin: top right; } #ctx { bottom: auto; top: 150px; max-width: calc(100vw - 24px); } #ctx .chip kbd { display: none; } #feed { top: 200px; } }
@media (prefers-reduced-motion: reduce) { .fi, #wanted.chase .star.on { animation: none; } }

/* Salute */
#hpbar i { background: linear-gradient(90deg, #d8323c, #ff7a6a); }
#hpbar.low i { animation: pulse .6s steps(2) infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.row2 { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; }
/* Arma */
#weapon { left: 14px; bottom: 14px; padding: 8px 10px; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: center; min-width: 230px; }
#weapon canvas { width: 64px; height: 32px; image-rendering: pixelated; }
#wname { font-size: 15px; font-weight: 600; }
#wammo { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--amber); line-height: 1; }
#wammo small { font-size: 13px; color: var(--muted); font-weight: 400; }
#wammo.empty { color: var(--blood); }
#wslots { grid-column: 1 / -1; display: flex; gap: 4px; }
#wslots span { font-family: var(--f-label); font-size: 9px; padding: 2px 5px; border: 1px solid var(--line); color: var(--muted); }
#wslots span.on { border-color: var(--amber); color: var(--amber); }
#wslots span.off { opacity: .3; }
#wreload { grid-column: 1 / -1; height: 4px; background: #241d38; } #wreload i { display: block; height: 100%; width: 0; background: var(--fg); }
/* Mirino */
#xhair { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
#xhair .ring { position: absolute; border: 2px solid rgba(255,240,210,.9); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
#xhair .dot { position: absolute; width: 4px; height: 4px; background: #fff; transform: translate(-50%, -50%); box-shadow: 0 0 0 1px #000; }
#xhair .hm { position: absolute; width: 22px; height: 22px; transform: translate(-50%, -50%) rotate(45deg); opacity: 0; }
#xhair .hm::before, #xhair .hm::after { content: ""; position: absolute; background: currentColor; box-shadow: 0 0 0 1px #000; }
#xhair .hm::before { left: 10px; top: 0; width: 2px; height: 22px; } #xhair .hm::after { top: 10px; left: 0; height: 2px; width: 22px; }

#bookBtn, #sound { right: 12px; padding: 0; font-family: var(--f-label); font-size: 9px; color: var(--muted); }
#bookBtn { top: 26px; gap: 4px; } #bookBtn kbd { font-size: 9px; }
#sound { top: 40px; }
#bookBtn:hover, #sound:hover { color: var(--fg); }
#feed { left: 12px; top: 70px; width: min(270px, calc(100vw - 24px)); gap: 2px; }
.fi { background: none; padding: 0 0 0 6px; font-size: 12px; border-left-width: 2px; }
#ctx { bottom: 12px; gap: 4px 14px; }
.chip { background: none; border: 0; box-shadow: none; padding: 0; font-size: 12px; gap: 5px; text-shadow: inherit; }

/* Dialogo più asciutto */

<!-- [sito] quale isola: la città nuova dappertutto, anche sul telefono ([leggera]: leggera_memoria.js la fa stare nella memoria del telefono;
     prima il telefono aveva l'isola di prima perché la pagina si chiudeva). ?vecchia riapre l'isola di prima, ?cittanuova resta accettato -->
<script>window.PV_NUOVA = (function () { try { const q = location.search; if (/[?&]vecchia/.test(q)) return false; return true; } catch (e) { return true; } })();</script>
<!-- [cotto] il mondo cotto nella build (strumenti/cuoci.js, lo chiama build.py): la mappa e la rete dei tetti già calcolate. Se il file
     manca o ha un'altra impronta dei sorgenti, o con ?cuoci=0, il gioco calcola come prima (src/cotto.js) -->
<script>window.PV_IMPRONTA_MONDO = '__IMPRONTA_MONDO__';</script>
<script>window.PV_IMPRONTA_TASS = '__IMPRONTA_TASS__';</script>   <!-- [tasselli] l'impronta della città a tasselli (build.py): tasselli/indice.json deve avere la stessa -->
<!-- [dieta] il file cotto letto come testo (una richiesta sincrona), non come <script>: lo script di 24 MB restava in memoria per sempre
     (il sorgente in V8 e la copia nella cache delle risorse, ~70 MB). Le due stringhe (i punti in JSON, il blocco in base64) si leggono
     e il testo si butta. Se la richiesta non va (file://) si torna al <script> di prima -->
<script>(function () {
  if (window.PV_CUOCI) return;
  let s = null; try { const x = new XMLHttpRequest(); x.open('GET', 'mondo_cotto.js', false); x.send(); if (x.status === 200 || (x.status === 0 && x.responseText)) s = x.responseText; } catch (e) { s = null; }
  if (s) try { const a = s.indexOf('punti: JSON.parse('), b = s.indexOf('), bin: "', a), c = s.lastIndexOf('"');
    const im = /impronta: "([0-9a-f]+)"/.exec(s.slice(0, 600)), ve = /versione: (\d+)/.exec(s.slice(0, 600));
    if (a > 0 && b > a && c > b && im && ve) { window.PV_COTTO = { versione: +ve[1], impronta: im[1], punti: JSON.parse(JSON.parse(s.slice(a + 18, b))), bin: JSON.parse(s.slice(b + 8, c + 1)) }; s = null; return; } } catch (e) { console.warn('[cotto] lettura', e); }
  document.write('<script src="mondo_cotto.js"><\/script>');
})();</script>
