<!doctype html>
<html><head><meta charset="utf-8"><title>Pianta 3D</title>
<style>html,body{margin:0;background:#0f131c;overflow:hidden}#lab{position:absolute;left:0;top:0;pointer-events:none;font:bold 12px monospace}
#lab div{position:absolute;transform:translate(-50%,-100%);background:#141821e6;color:#ffd9a0;padding:1px 4px;white-space:nowrap;border:1px solid #2a2f3a}</style>
</head><body><div id="lab"></div>
<script src="../src/three.min.js"></script>
<script src="../src/world.js"></script>
<script>
// Vista d'insieme della mappa (solo world.js): terreno alle quote vere, alberi, edifici, strade, etichette.
// Parametri: ?box=x0,y0,x1,y1 (metri) &lab=id,id,... &w=1600&h=1000 &yaw=0.785 &pitch=0.62 &top=1 (dall'alto)
const Q = new URLSearchParams(location.search), W = World, TS = W.TS, T = W.T;
const box = (Q.get('box') || `0,0,${W.SX},${W.SY}`).split(',').map(Number);
const SW = +(Q.get('w') || 1600), SH = +(Q.get('h') || 1000);
const ren = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); ren.setSize(SW, SH); ren.setClearColor('#0f131c'); document.body.appendChild(ren.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight('#dfe6f0', '#3a3a40', .75));
const sun = new THREE.DirectionalLight('#fff4e0', .8); sun.position.set(-300, 500, -200); scene.add(sun);
const COL = {}; Object.entries({ COB: '#8a8580', VIA: '#4a4850', BLD: '#b07060', PIAZZA: '#b8b0a0', WATER: '#284868', QUAY: '#7a7570', FOUNT: '#5a90b0', PIER: '#7a5a3a', SAND: '#e6d6b0', GRASS: '#5d7a4c', STAIRS: '#a09080', WALK: '#a8a49c', ROCK: '#8a8480', TREE: '#3c5a3c', DIRT: '#9a8064', FIELD: '#8a8a58', DESERT: '#b0a070', SALT: '#e8eaea', SHRUB: '#5a6e48', CLIFF: '#77706c', GRAVEL: '#a49a8c' }).forEach(([k, v]) => COL[T[k]] = new THREE.Color(v));
const x0 = Math.max(0, Math.floor(box[0] / TS)), y0 = Math.max(0, Math.floor(box[1] / TS)), x1 = Math.min(W.GW, Math.ceil(box[2] / TS)), y1 = Math.min(W.GH, Math.ceil(box[3] / TS));
// terreno: una faccia per casella, quote ai vertici (W.vh)
{
  const nx = x1 - x0, ny = y1 - y0, pos = new Float32Array(nx * ny * 18), col = new Float32Array(nx * ny * 18); let o = 0;
  const V = (i, j) => W.vh[j * W.VW + i];
  for (let ty = y0; ty < y1; ty++) for (let tx = x0; tx < x1; tx++) {
    const v = W.grid[ty * W.GW + tx], f = W.feat ? W.feat[ty * W.GW + tx] : 0; let c = (COL[v] || new THREE.Color('#f0f')).clone();
    if (f & 512) c = new THREE.Color('#9a9284'); if (f & 1024) c = new THREE.Color('#6e6660');
    if (v === T.WATER && W.zone[ty * W.GW + tx] === W.Z.MARE) continue;
    const q = [[tx, ty], [tx + 1, ty + 1], [tx + 1, ty], [tx, ty], [tx, ty + 1], [tx + 1, ty + 1]];
    const sh = .92 + W.hash2(tx, ty, 9) * .12;
    q.forEach(([i, j]) => { pos[o] = i * TS; pos[o + 1] = v === T.WATER ? W.elev[ty * W.GW + tx] + .6 : V(i, j); pos[o + 2] = j * TS; col[o] = c.r * sh; col[o + 1] = c.g * sh; col[o + 2] = c.b * sh; o += 3; });
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos.slice(0, o), 3)); g.setAttribute('color', new THREE.BufferAttribute(col.slice(0, o), 3)); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true })));
}
// mare
{ const m = new THREE.Mesh(new THREE.PlaneGeometry(box[2] - box[0], box[3] - box[1]), new THREE.MeshLambertMaterial({ color: '#2a4466' })); m.rotation.x = -Math.PI / 2; m.position.set((box[0] + box[2]) / 2, -.3, (box[1] + box[3]) / 2); scene.add(m); }
// alberi
{
  const geo = new THREE.ConeGeometry(1.5, 5, 5); geo.translate(0, 2.5, 0); const L = [];
  for (let ty = y0; ty < y1; ty++) for (let tx = x0; tx < x1; tx++) if (W.grid[ty * W.GW + tx] === T.TREE) L.push([tx, ty]);
  const im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color: '#2a4a32' }), L.length), M = new THREE.Matrix4();
  L.forEach(([tx, ty], k) => { const s = .8 + W.hash2(tx, ty, 3) * .6; M.makeScale(s, s, s); M.setPosition(tx * TS + 1 + (W.hash2(tx, ty, 4) - .5), W.elev[ty * W.GW + tx], ty * TS + 1 + (W.hash2(tx, ty, 5) - .5)); im.setMatrixAt(k, M); });
  scene.add(im);
}
// edifici
W.BUILDINGS.forEach(b => {
  if (b.x + b.w < x0 || b.x > x1 || b.y + b.h < y0 || b.y > y1) return;
  const h = Math.max(1, b.fl) * 3.2 + (b.lighthouse ? 8 : 0), c = b.military ? '#7a8070' : b.shack ? '#8a7a6a' : b.fisher ? '#b0a090' : b.gov ? '#a8a4a0' : b.name ? '#c07a70' : '#a8705c';
  const m = new THREE.Mesh(new THREE.BoxGeometry(b.w * TS - .3, h, b.h * TS - .3), new THREE.MeshLambertMaterial({ color: c }));
  m.position.set((b.x + b.w / 2) * TS, b.base + h / 2, (b.y + b.h / 2) * TS); scene.add(m);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(b.w * TS - .2, .3, b.h * TS - .2), new THREE.MeshLambertMaterial({ color: '#e8e6e2' })); roof.position.set(m.position.x, b.base + h + .15, m.position.z); scene.add(roof);
});
// gallerie e opere (se ci sono)
(W.TUNNELS || []).forEach(t => t.pts.forEach(([x, y, h], k) => { if (k % 2) return; const m = new THREE.Mesh(new THREE.BoxGeometry(t.w + 1.2, 5.4, 2.2), new THREE.MeshLambertMaterial({ color: '#8a8682' })); m.position.set(x, h + 2.7, y); scene.add(m); }));
// camera
const cx = (box[0] + box[2]) / 2, cz = (box[1] + box[3]) / 2, ext = Math.max(box[2] - box[0], box[3] - box[1]);
const yaw = +(Q.get('yaw') || .62), pitch = Q.get('top') ? 1.5707 : +(Q.get('pitch') || .66), zoom = +(Q.get('zoom') || 1);
const asp = SW / SH, half = ext * .38 / zoom;
const cam = new THREE.OrthographicCamera(-half * asp, half * asp, half, -half, 1, 6000);
const d = 2500; cam.position.set(cx - Math.cos(pitch) * Math.sin(yaw) * d, Math.sin(pitch) * d, cz + Math.cos(pitch) * Math.cos(yaw) * d); cam.lookAt(cx, 0, cz);
if (Q.get('top')) { cam.up.set(0, 0, -1); cam.position.set(cx, d, cz); cam.lookAt(cx, 0, cz); }
ren.render(scene, cam);
// etichette
const lab = document.getElementById('lab'), ids = (Q.get('lab') || '').split(',').filter(Boolean);
ids.forEach(id => { const p = W.PLACES[id]; if (!p) return; const v = new THREE.Vector3(p.x, W.elev[p.ty * W.GW + p.tx] + 4, p.y).project(cam); const e = document.createElement('div'); e.textContent = p.name; e.style.left = ((v.x + 1) / 2 * SW) + 'px'; e.style.top = ((1 - v.y) / 2 * SH) + 'px'; lab.appendChild(e); });
document.title = 'pronto';
</script></body></html>
