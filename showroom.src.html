<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#1a1426}canvas{display:block}</style></head><body>
<script>/*THREE*/</script><script>/*GAME*/</script><script>/*RENDER*/</script>
<script>
const M = Render.__models, W = 1200, H = 800;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color('#2a2036');
s.add(new THREE.HemisphereLight('#c8c0ff', '#3a2a40', .9)); const d = new THREE.DirectionalLight('#fff0e0', 1.1); d.position.set(5, 8, 6); s.add(d);
const cam = new THREE.PerspectiveCamera(window.FOV || 30, W / H, .1, 200);
window.show = (which) => {
  while (s.children.length > 2) s.remove(s.children[2]);
  if (which === 'armi') {
    ['pistola', 'lupara', 'mitra', 'molotov'].forEach((k, i) => { const w = M.weaponModel(k); w.scale.multiplyScalar(4); w.position.set(-3 + i * 2, 0, 0); w.rotation.y = -1.2; s.add(w); const p = M.pickupMesh(k); p.position.set(-3 + i * 2, -2.6, 0); s.add(p); });
    ['munizioni', 'salute', 'soldi', 'valigetta'].forEach((k, i) => { const p = M.pickupMesh(k); p.position.set(-3 + i * 2, -5.2, 0); s.add(p); });
    cam.fov = 30; cam.updateProjectionMatrix(); cam.position.set(0, -1, 11); cam.lookAt(0, -2.2, 0);
  } else {
    const kinds = [['cinquecento', '#f3c6d4'], ['ritmo', '#b8302a'], ['giulia', '#2f4a3a'], ['polizia', '#8fb4d8'], ['ape', '#7a9ab0']];
    kinds.forEach(([k, c], i) => { const g = M.carMesh(k, c, k === 'polizia'); g.position.set(-10 + i * 5, 0, 0); g.rotation.y = which === 'retro' ? 2.4 : .75; s.add(g);
      if (which === 'danni') { const v = { kind: k, hp: 10 }; for (let n = 0; n < 5; n++) M.applyDamage(v, g.userData, [(Math.random() - .5) * 1.4, .6, (Math.random() < .5 ? 1 : -1) * 1.5]); } });
    const v = M.vespaMesh('#8ab4e8'); v.position.set(15, 0, 0); v.rotation.y = .9; s.add(v);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 20), new THREE.MeshLambertMaterial({ color: '#3a3444' })); floor.rotation.x = -Math.PI / 2; s.add(floor);
    cam.fov = 44; cam.updateProjectionMatrix(); cam.position.set(2.5, 8, 24); cam.lookAt(2.5, .3, 0);
  }
  r.render(s, cam);
};
</script></body></html>
